<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haus & Garten Flierl – Heckenschnitt</title>
<meta name="description" content="Haus & Garten Flierl – Heckenschnitt in Bruchsal & Umgebung.">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#03271c;font-family:Arial,sans-serif}body{overflow-x:hidden}
.page{position:relative;width:min(100vw,1024px);margin:0 auto;line-height:0}.page>img{display:block;width:100%;height:auto}
.hot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;z-index:5}
.hot:focus{outline:2px solid #b7df62;outline-offset:2px}
.cta{left:4.5%;top:32.8%;width:31%;height:4.2%}
.calc{left:2%;top:38%;width:96%;height:21%}
.phone{left:65%;top:1.1%;width:13%;height:3.1%}
.footercta{right:2%;top:94.4%;width:18%;height:3.2%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:20;line-height:1.3}.modal.open{display:flex}
.box{width:min(560px,100%);background:#fffdf8;border-radius:24px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.35);color:#17352a}.box h2{margin:0 0 5px;font-size:25px}.box p{margin:0 0 18px;color:#66766d;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;margin:0 0 5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd9d0;border-radius:12px;font:inherit}.result{margin-top:14px;background:#2c70a6;color:#fff;border-radius:16px;padding:15px}.result small{display:block;opacity:.75}.result strong{font-size:31px}.buttons{display:flex;gap:9px;margin-top:12px}.btn{border:0;border-radius:999px;padding:13px 17px;font-weight:800;cursor:pointer}.green{background:#0d6445;color:#fff}.lime{background:#8fca3b;color:#103622}.close{margin-left:auto;background:#eef1ec}.topline{display:flex;gap:10px;align-items:center}.topline h2{flex:1}
@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.buttons{flex-direction:column}.box{padding:19px}.cta{height:4.5%}.calc{top:37.5%;height:22%}}
</style>
</head>
<body>
<main class="page" aria-label="Haus & Garten Flierl">
<img src="assets/IMG_0606.png" alt="Haus & Garten Flierl – Heckenschnitt in Bruchsal und Umgebung">
<button class="hot cta" aria-label="Anfrage starten" onclick="openCalc()"></button>
<button class="hot calc" aria-label="Richtpreis-Rechner öffnen" onclick="openCalc()"></button>
<a class="hot phone" aria-label="Telefon anrufen" href="tel:+491735389925"></a>
<button class="hot footercta" aria-label="Anfrage starten" onclick="openCalc()"></button>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title">
<div class="box">
<div class="topline"><h2 id="title">Ihr individueller Richtpreis</h2><button class="btn close" onclick="closeCalc()">Schließen</button></div>
<p>Maße eingeben – der Richtpreis wird sofort berechnet.</p>
<div class="grid">
<div class="field"><label>Heckenlänge (m)</label><input id="len" inputmode="decimal" placeholder="z. B. 21,5" oninput="calculate()"></div>
<div class="field"><label>Heckenhöhe</label><select id="height" onchange="calculate()"><option value="0">Bis 1,50 m</option><option value="1">1,51–2,50 m</option><option value="2">Über 2,50 m</option></select></div>
<div class="field full"><label>Schnittart</label><select id="type" onchange="calculate()"><option value="pflege">Form-/Pflegeschnitt</option><option value="rueck">Rückschnitt</option></select></div>
<div class="field full"><label>Schnittgut</label><select id="waste"><option>Ja, bitte entsorgen</option><option>Nein, Schnittgut bleibt vor Ort</option></select></div>
</div>
<div class="result"><small>Ihr Richtpreis – Arbeitsleistung</small><strong id="price">—</strong></div>
<div class="buttons"><button class="btn lime" onclick="mailRequest()">Richtpreis übernehmen & Anfrage senden →</button><button class="btn green" onclick="closeCalc()">Weiter auf der Seite</button></div>
</div></div>
<script>
const rates={pflege:[6,8,12],rueck:[12,16,22]};
function calculate(){const n=parseFloat(String(document.getElementById('len').value).replace(',','.'));const h=+document.getElementById('height').value;const t=document.getElementById('type').value;const p=document.getElementById('price');if(!n||n<=0){p.textContent='—';return}p.textContent=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n*rates[t][h])}
function openCalc(){document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('len').focus(),50)}
function closeCalc(){document.getElementById('modal').classList.remove('open')}
function mailRequest(){const n=document.getElementById('len').value;const h=document.getElementById('height').selectedOptions[0].text;const t=document.getElementById('type').selectedOptions[0].text;const w=document.getElementById('waste').value;const price=document.getElementById('price').textContent;const subject=encodeURIComponent('Heckenschnitt-Anfrage – Haus & Garten Flierl');const body=encodeURIComponent('Hallo Patrick Flierl,\n\nich möchte einen Heckenschnitt anfragen.\n\nHeckenlänge: '+n+' m\nHeckenhöhe: '+h+'\nSchnittart: '+t+'\nSchnittgut: '+w+'\nRichtpreis: '+price+'\n\nBitte melden Sie sich zur Terminabstimmung.\n\nViele Grüße');location.href='mailto:haus-und-garten.flierl@gmx.de?subject='+subject+'&body='+body}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeCalc()});
</script>
</body>
</html>
